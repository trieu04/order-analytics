<!doctype html>
<html lang="vi"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Minecraft Order Analytics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak]{display:none!important} main{max-width:1100px} header{margin-block:2rem 1rem}
    header nav ul{align-items:center}.status{white-space:nowrap}.message{min-height:1.6rem;margin:0}
    .items{display:grid;grid-template-columns:auto minmax(220px,1fr) minmax(180px,1fr) auto auto;gap:.65rem;align-items:center}
    .items input,.items button{margin-bottom:0}.head{font-weight:600;color:var(--pico-muted-color)}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
    .section-head h2,.section-head select,.section-head button{margin-bottom:0}.section-head select{min-width:260px}
    .metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1rem;margin-block:1rem}
    .metric{padding:1rem;border:1px solid var(--pico-muted-border-color);border-radius:var(--pico-border-radius)}
    .metric-focus{border:2px solid color-mix(in srgb,var(--pico-primary) 22%,var(--pico-muted-border-color))}
    .history-table{border-collapse:collapse}.history-table th,.history-table td{border:1px solid color-mix(in srgb,var(--pico-muted-border-color) 100%,transparent)}
    .history-table .focus-col{background:color-mix(in srgb,var(--pico-primary) 2.5%,transparent)}
    .metric small{display:block;color:var(--pico-muted-color)}.metric strong{display:block;font-size:1.45rem;margin:.2rem 0}
    .metric strong,.market-cell strong{font-variant-numeric:tabular-nums}.market-cell{min-width:175px}.market-cell strong{display:block;font-weight:650}.market-cell small{display:block;margin-top:.15rem;color:var(--pico-muted-color)}
    .market-cell .queue{color:var(--pico-color)}.fill-detail{display:flex;justify-content:space-between;gap:.75rem;margin-top:.35rem;font-size:.72rem;color:var(--pico-muted-color);font-variant-numeric:tabular-nums}
    .fill-track{height:3px;margin-top:.2rem;background:var(--pico-muted-border-color);border-radius:4px;overflow:hidden}.fill-track span{display:block;height:100%;background:color-mix(in srgb,var(--pico-primary) 65%,var(--pico-muted-color));border-radius:inherit}
    .up{color:#16803c}.down{color:#c52f21}.table-wrap{overflow-x:auto}table{white-space:nowrap}
    .bar{width:110px;height:.5rem;background:var(--pico-muted-border-color);border-radius:1rem;overflow:hidden}
    .bar span{display:block;height:100%;background:var(--pico-primary);border-radius:inherit}
    @media(max-width:700px){.head{display:none}.items{grid-template-columns:auto 1fr auto auto}.items .query{grid-column:2/-1}}
    @media(max-width:800px){.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.section-head select{width:100%}}
    @media(max-width:420px){.metrics{grid-template-columns:1fr}}
  </style>
</head><body>
<main class="container" x-data="configUi()" x-init="load()" x-cloak>
  <header><nav>
    <ul><li><hgroup><h1>Order Analytics</h1><p>Thống kê buy order Minecraft</p></hgroup></li></ul>
    <ul><li><a href="/" aria-current="page">Thống kê</a></li><li><a href="/accounts">Tài khoản</a></li><li><a href="/settings">Cấu hình</a></li></ul>
  </nav></header>

  <article>
    <header class="section-head">
      <hgroup><h2>Thống kê thị trường</h2><p>Snapshot và price ladder gần nhất</p></hgroup>
      <div role="group">
        <select x-model="selectedItem" @change="loadStats()" aria-label="Chọn item thống kê">
          <option value="">Chọn item</option>
          <template x-for="item in config.items" :key="item.id"><option :value="item.id" x-text="item.id"></option></template>
        </select>
        <button class="outline" :aria-busy="statsLoading" :disabled="statsLoading||!selectedItem" @click="loadStats()">Làm mới</button>
      </div>
    </header>
    <div x-show="statsLoading" aria-busy="true">Đang tải thống kê…</div>
    <template x-if="!statsLoading && latest"><div>
      <div class="metrics">
        <div class="metric metric-focus market-cell"><small>Giá thị trường cao nhất</small><strong x-text="formatNumber(latest.marketMaxPrice)"></strong><small class="queue" x-text="`Queue ${formatNumber(latest.marketMaxPriceQueue)}`"></small><div class="fill-detail"><span x-text="`${formatNumber(latest.marketMaxPriceDelivered)} / ${formatNumber(latest.marketMaxPriceVolume)}`"></span><span x-text="formatPercent(ratio(latest.marketMaxPriceDelivered,latest.marketMaxPriceVolume))"></span></div><div class="fill-track"><span :style="`width:${percentWidth(latest.marketMaxPriceDelivered,latest.marketMaxPriceVolume)}%`"></span></div></div>
        <div class="metric metric-focus market-cell"><small>Order trên giá trung bình</small><strong x-text="`> ${formatNumber(latest.marketAveragePrice,2)}`"></strong><small class="queue" x-text="`Queue ${formatNumber(latest.higherThanAverageQueue)}`"></small><div class="fill-detail"><span x-text="`${formatNumber(latest.higherThanAverageDelivered)} / ${formatNumber(latest.higherThanAverageVolume)}`"></span><span x-text="formatPercent(ratio(latest.higherThanAverageDelivered,latest.higherThanAverageVolume))"></span></div><div class="fill-track"><span :style="`width:${percentWidth(latest.higherThanAverageDelivered,latest.higherThanAverageVolume)}%`"></span></div></div>
        <div class="metric"><small>Giá thị trường trung bình</small><strong x-text="formatNumber(latest.marketAveragePrice,2)"></strong><small>Weighted theo delivered</small></div>
        <div class="metric market-cell"><small>Order mẫu</small><strong x-text="`${formatNumber(latest.marketSampleOrderCount)} orders`"></strong><div class="fill-detail"><span x-text="`${formatNumber(latest.marketSampleDelivered)} / ${formatNumber(latest.marketSampleVolume)}`"></span><span x-text="formatPercent(ratio(latest.marketSampleDelivered,latest.marketSampleVolume))"></span></div><div class="fill-track"><span :style="`width:${percentWidth(latest.marketSampleDelivered,latest.marketSampleVolume)}%`"></span></div></div>
        <div class="metric"><small>Giá buy tốt nhất</small><strong x-text="formatNumber(latest.bestPrice)"></strong><small :class="changeClass(priceChange)" x-text="formatChange(priceChange)"></small></div>
        <div class="metric"><small>Quan sát gần nhất</small><strong x-text="formatTime(latest.observedAt)"></strong><small x-text="formatDateOnly(latest.observedAt)"></small></div>
      </div>
      <h3>Price ladder hiện tại</h3>
      <div class="table-wrap"><table><thead><tr><th>Giá</th><th>Volume</th><th>Fill</th><th>Queue giá cao hơn</th><th>Velocity/phút</th></tr></thead><tbody>
        <template x-for="level in opportunities" :key="level.price"><tr>
          <td x-text="formatNumber(level.price)"></td><td x-text="formatNumber(level.remainingVolume)"></td>
          <td><span x-text="formatPercent(level.fillRatio)"></span><div class="bar"><span :style="`width:${Math.max(0,Math.min(100,Number(level.fillRatio)*100))}%`"></span></div></td>
          <td x-text="formatNumber(level.higherPriceQueue)"></td><td x-text="level.fillVelocityPerMinute==null?'Chưa đủ dữ liệu':formatNumber(level.fillVelocityPerMinute,2)"></td>
        </tr></template>
      </tbody></table></div>
      <h3>Lịch sử gần đây</h3>
      <p><small>Mỗi tỷ lệ hiển thị Delivered / Volume và fill tương ứng. Giá trung bình weighting theo số đã giao.</small></p>
      <div class="table-wrap"><table class="history-table"><thead><tr><th>Thời gian</th><th class="focus-col">Giá cao nhất</th><th class="focus-col">Trên trung bình</th><th>Giá trung bình</th><th>Mẫu</th></tr></thead><tbody>
        <template x-for="snapshot in snapshots" :key="snapshot.id"><tr>
          <td x-text="formatDate(snapshot.observedAt)"></td>
          <td class="market-cell focus-col"><strong x-text="formatNumber(snapshot.marketMaxPrice)"></strong><small class="queue" x-text="`Queue ${formatNumber(snapshot.marketMaxPriceQueue)}`"></small><div class="fill-detail"><span x-text="`${formatNumber(snapshot.marketMaxPriceDelivered)} / ${formatNumber(snapshot.marketMaxPriceVolume)}`"></span><span x-text="formatPercent(ratio(snapshot.marketMaxPriceDelivered,snapshot.marketMaxPriceVolume))"></span></div><div class="fill-track"><span :style="`width:${percentWidth(snapshot.marketMaxPriceDelivered,snapshot.marketMaxPriceVolume)}%`"></span></div></td>
          <td class="market-cell focus-col"><strong x-text="`> ${formatNumber(snapshot.marketAveragePrice,2)}`"></strong><small class="queue" x-text="`Queue ${formatNumber(snapshot.higherThanAverageQueue)}`"></small><div class="fill-detail"><span x-text="`${formatNumber(snapshot.higherThanAverageDelivered)} / ${formatNumber(snapshot.higherThanAverageVolume)}`"></span><span x-text="formatPercent(ratio(snapshot.higherThanAverageDelivered,snapshot.higherThanAverageVolume))"></span></div><div class="fill-track"><span :style="`width:${percentWidth(snapshot.higherThanAverageDelivered,snapshot.higherThanAverageVolume)}%`"></span></div></td>
          <td class="market-cell"><strong x-text="formatNumber(snapshot.marketAveragePrice,2)"></strong></td>
          <td class="market-cell"><strong x-text="`${formatNumber(snapshot.marketSampleOrderCount)} orders`"></strong><div class="fill-detail"><span x-text="`${formatNumber(snapshot.marketSampleDelivered)} / ${formatNumber(snapshot.marketSampleVolume)}`"></span><span x-text="formatPercent(ratio(snapshot.marketSampleDelivered,snapshot.marketSampleVolume))"></span></div><div class="fill-track"><span :style="`width:${percentWidth(snapshot.marketSampleDelivered,snapshot.marketSampleVolume)}%`"></span></div></td>
        </tr></template>
      </tbody></table></div>
    </div></template>
    <p x-show="!statsLoading && selectedItem && !latest"><small>Chưa có snapshot cho item này. Hãy chạy một lần quét.</small></p>
    <p x-show="!selectedItem"><small>Chọn một item để xem thống kê.</small></p>
  </article>

  <p class="message" x-text="message"></p>
</main>
<script>
function configUi(){return{
  config:{items:[]},health:{ok:false},message:'',scanning:null,
  selectedItem:'',snapshots:[],opportunities:[],statsLoading:false,
  get latest(){return this.snapshots[0]||null},get previous(){return this.snapshots[1]||null},
  get priceChange(){return this.delta('bestPrice')},
  async request(url,options){const response=await fetch(url,options),data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);return data},
  notify(text,error=false){this.message=(error?'Lỗi: ':'')+text},
  async load(){try{[this.config,this.health]=await Promise.all([this.request('/api/settings'),this.request('/api/health')]);if(!this.config.items.some(item=>item.id===this.selectedItem))this.selectedItem=this.config.items[0]?.id||'';await this.loadStats();this.notify('')}catch(error){this.notify(error.message,true)}},
  async loadStats(){this.snapshots=[];this.opportunities=[];if(!this.selectedItem)return;this.statsLoading=true;try{[this.snapshots,this.opportunities]=await Promise.all([this.request(`/api/analytics/snapshots?itemId=${encodeURIComponent(this.selectedItem)}&limit=20`),this.request(`/api/analytics/opportunities/${encodeURIComponent(this.selectedItem)}`)])}catch(error){this.notify(error.message,true)}finally{this.statsLoading=false}},
  delta(field){if(!this.latest||!this.previous||this.latest[field]==null||this.previous[field]==null)return null;return Number(this.latest[field])-Number(this.previous[field])},
  formatNumber(value,digits=0){if(value==null)return '—';return new Intl.NumberFormat('vi-VN',{maximumFractionDigits:digits}).format(Number(value))},
  formatPercent(value){return value==null?'—':new Intl.NumberFormat('vi-VN',{style:'percent',maximumFractionDigits:1}).format(Number(value))},
  ratio(delivered,volume){const total=Number(volume);return total>0?Number(delivered)/total:null},
  percentWidth(delivered,volume){const value=this.ratio(delivered,volume);return value==null?0:Math.max(0,Math.min(100,value*100))},
  formatDate(value){return value?new Intl.DateTimeFormat('vi-VN',{dateStyle:'short',timeStyle:'medium'}).format(new Date(value)):'—'},
  formatDateOnly(value){return value?new Intl.DateTimeFormat('vi-VN',{dateStyle:'short'}).format(new Date(value)):'—'},
  formatTime(value){return value?new Intl.DateTimeFormat('vi-VN',{timeStyle:'medium'}).format(new Date(value)):'—'},
  activeOrdersLabel(value){return Number(value)>0?`${this.formatNumber(value)} orders có fill`:'Không có order đã fill'},
  formatChange(value){return value==null?'Chưa có lần quét trước':`${value>0?'+':''}${this.formatNumber(value)} so với lần trước`},changeClass(value){return value>0?'up':value<0?'down':''},
  async scan(item){this.scanning=item.id;try{const job=await this.request(`/api/analytics/scans/${encodeURIComponent(item.id)}`,{method:'POST'});this.selectedItem=item.id;this.notify(`Đã xếp hàng ${item.id} (job ${job.id})`)}catch(error){this.notify(error.message,true)}finally{this.scanning=null}}
}}
</script></body></html>
