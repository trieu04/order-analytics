name: order-analytics

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-order_analytics}
      POSTGRES_USER: ${POSTGRES_USER:-order_analytics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-order_analytics}
    ports:
      - "127.0.0.1:${SERVICE_PORT_PG:-6610}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: order-analytics-app:local
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MC_PROFILES_FOLDER: /app/profiles
      DATABASE_URL: ${SERVICE_DATABASE_URL:-postgres://order_analytics:order_analytics@postgres:5432/order_analytics}
    ports:
      - "127.0.0.1:${SERVICE_PORT_API:-6600}:${API_PORT:-6600}"
    volumes:
      - auth-profiles:/app/profiles
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+(process.env.API_PORT||6600)+'/api/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  collector:
    image: order-analytics-app:local
    build: .
    command: ["node", "src/collector/main.js"]
    init: true
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MC_PROFILES_FOLDER: /app/profiles
      DATABASE_URL: ${SERVICE_DATABASE_URL:-postgres://order_analytics:order_analytics@postgres:5432/order_analytics}
      INTERNAL_API_URL: http://api:${API_PORT:-6600}
    volumes:
      - auth-profiles:/app/profiles

volumes:
  postgres-data:
  auth-profiles:
